name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build

      - name: Production start smoke
        env:
          NODE_ENV: production
          PORT: '3100'
          DATABASE_PATH: /tmp/rooms-smoke/mcp_rooms.db
          EMBEDDING_PROVIDER: disabled
        run: |
          set -euo pipefail
          npx tsx server.ts > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/listings > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3100/api/listings > /dev/null; then
            echo 'server did not become ready'; cat /tmp/server.log; exit 1
          fi
          curl -fsS -X POST http://127.0.0.1:3100/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > /tmp/mcp.json
          grep -q '"tools"' /tmp/mcp.json
          grep -q 'search_listings' /tmp/mcp.json
          echo 'smoke ok'
