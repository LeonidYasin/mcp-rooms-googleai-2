name: Tag-based Deployment (Git Tag Release)

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Auto-Provision & Deploy to VPS on Git Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH Auto-Provisioning & Deployment
        uses: appleboy/ssh-action@v1.0.0
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_PASSWORD
          script: |
            set -e
            echo "🚀 Starting automated VPS provisioning and tag release deployment..."

            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin

            run_sudo() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              elif [ -n "$VPS_PASSWORD" ]; then
                echo "$VPS_PASSWORD" | sudo -S "$@"
              else
                sudo -n "$@" 2>/dev/null || sudo "$@"
              fi
            }

            # 1. Install Docker & Docker Compose if not installed on VPS
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker on VPS..."
              curl -fsSL https://get.docker.com | run_sudo sh
            fi

            # 2. Add current user to docker group if needed
            if ! groups $USER 2>/dev/null | grep -q docker; then
              run_sudo usermod -aG docker $USER || true
            fi

            # 3. Create project working directories
            run_sudo mkdir -p /opt/mcp-rooms
            run_sudo chown -R $USER:$USER /opt/mcp-rooms
            cd /opt/mcp-rooms

            # 4. Clone or update repository to latest code/tag
            if [ ! -d ".git" ]; then
              git clone https://github.com/LeonidYasin/mcp-rooms-googleai-2.git .
            fi
            git fetch --all --tags
            git checkout -f "tags/${{ github.ref_name }}" || git checkout -f "${{ github.ref_name }}"

            # 5. Bootstrap default .env if missing
            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "DOMAIN=${{ secrets.VPS_HOST }}" >> .env
            fi

            # 6. Ensure persistent database and upload directories with non-root UID 1000
            mkdir -p ./data/uploads ./data/thumbnails
            run_sudo chown -R 1000:1000 ./data || true

            # Check if ports 80/443 are already in use by host Caddy/Nginx
            HOST_WEB_ACTIVE=false
            OUR_CADDY_RUNNING=false
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -q 'mcp_rooms_caddy'; then
              OUR_CADDY_RUNNING=true
            fi

            if [ "$OUR_CADDY_RUNNING" = "false" ]; then
              if ss -tlpn 2>/dev/null | grep -E ':(80|443)\b' &>/dev/null; then
                HOST_WEB_ACTIVE=true
              elif netstat -tlpn 2>/dev/null | grep -E ':(80|443)\b' &>/dev/null; then
                HOST_WEB_ACTIVE=true
              elif lsof -i :80 -sTCP:LISTEN &>/dev/null 2>&1 || lsof -i :443 -sTCP:LISTEN &>/dev/null 2>&1; then
                HOST_WEB_ACTIVE=true
              fi
            fi

            if [ "$HOST_WEB_ACTIVE" = "true" ]; then
              echo "⚠️ Обнаружен работающий веб-сервер на портах 80/443 (хостовый Caddy/Nginx)!"
              echo "ℹ️ Запускаем docker-compose.yml (только сервис mcp-rooms на 127.0.0.1:3000 во избежание конфликта)"
              COMPOSE_FILE="docker-compose.yml"
            else
              echo "✅ Порты 80 и 443 свободны."
              echo "ℹ️ Запускаем автономный стек со встроенным Caddy (docker-compose.prod.yml)"
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            # 7. Build and run production Docker containers
            if docker compose version &>/dev/null; then
              docker compose -f "$COMPOSE_FILE" up -d --build
            else
              run_sudo docker compose -f "$COMPOSE_FILE" up -d --build
            fi

            echo "⏳ Waiting for containers to become healthy..."
            sleep 10

            echo "🔍 Probing application health endpoint..."
            for i in $(seq 1 12); do
              if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                echo "✅ mcp-rooms is healthy and responding on http://127.0.0.1:3000/api/health!"
                break
              fi
              echo "Waiting for app to start ($i/12)..."
              sleep 5
            done

            echo "=== FINAL RUNTIME STATUS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- Health API Response ---"
            curl -sS http://127.0.0.1:3000/api/health || true
            echo ""

            echo "🚀 Executing Live E2E MCP & Room Scenarios inside container..."
            docker exec mcp_rooms_marketplace node --import tsx scripts/run-live-scenarios.ts

            echo "✅ Auto-provisioning & deployment successful!"
