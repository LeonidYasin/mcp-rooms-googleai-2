name: Deploy CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deploy-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Pre-Deploy Check Script
        run: ./scripts/pre-deploy-check.sh

  deploy-vps:
    runs-on: ubuntu-24.04
    needs: pre-deploy-checks
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to Production VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mcp-rooms' }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" "mkdir -p ${DEPLOY_PATH}"
          rsync -avz --exclude='.git' --exclude='node_modules' --exclude='data' ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" "cd ${DEPLOY_PATH} && docker compose -f docker-compose.prod.yml up -d --build"
