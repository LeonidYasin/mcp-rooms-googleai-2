name: Continuous Deployment (VPS Auto-Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_PASSWORD
          script: |
            set -e
            echo "🚀 Starting automated deployment..."

            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:$HOME/.local/bin

            echo "=== VPS DIAGNOSTICS ==="
            echo "USER: $(whoami)"
            echo "HOME: $HOME"
            echo "ID: $(id)"
            echo "GROUPS: $(groups 2>/dev/null || true)"
            echo "PATH: $PATH"
            which docker || true
            docker --version || true
            docker compose version || true

            echo "=== HOST WEB SERVERS & PORTS ==="
            ss -tlpn 2>/dev/null | grep -E ':(80|443|3000)\b' || true
            ps aux | grep -E 'caddy|nginx|apache' | grep -v grep || true
            which caddy || true
            find /etc -maxdepth 3 -name "*caddy*" -o -name "*Caddy*" 2>/dev/null || true
            ls -la /etc/caddy 2>/dev/null || true

            DEPLOY_DIR="/opt/mcp-rooms"
            if [ ! -w "/opt" ] && [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/mcp-rooms"
            fi
            echo "DEPLOY_DIR: $DEPLOY_DIR"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Clone or update repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/LeonidYasin/mcp-rooms-googleai-2.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            python3 scripts/inspect-caddy.py 2>/dev/null || true

            cp scripts/fix-caddy.sh "$HOME/fix-caddy.sh" 2>/dev/null || true
            chmod +x "$HOME/fix-caddy.sh" 2>/dev/null || true

            # Bootstrap default .env if missing
            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "DOMAIN=${{ secrets.VPS_HOST }}" >> .env
            fi

            # Ensure persistent directories
            mkdir -p ./data/uploads ./data/thumbnails
            chmod -R 777 ./data 2>/dev/null || true

            # Check if ports 80/443 are already in use by host Caddy/Nginx
            HOST_WEB_ACTIVE=false
            OUR_CADDY_RUNNING=false
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -q 'mcp_rooms_caddy'; then
              OUR_CADDY_RUNNING=true
            fi

            if [ "$OUR_CADDY_RUNNING" = "false" ]; then
              if ss -tlpn 2>/dev/null | grep -E ':(80|443)\b' &>/dev/null; then
                HOST_WEB_ACTIVE=true
              elif netstat -tlpn 2>/dev/null | grep -E ':(80|443)\b' &>/dev/null; then
                HOST_WEB_ACTIVE=true
              elif lsof -i :80 -sTCP:LISTEN &>/dev/null 2>&1 || lsof -i :443 -sTCP:LISTEN &>/dev/null 2>&1; then
                HOST_WEB_ACTIVE=true
              fi
            fi

            if [ "$HOST_WEB_ACTIVE" = "true" ]; then
              echo "⚠️ Обнаружен работающий веб-сервер на портах 80/443 (хостовый Caddy/Nginx)!"
              echo "ℹ️ Запускаем docker-compose.yml (только сервис mcp-rooms на 127.0.0.1:3000 во избежание конфликта)"
              COMPOSE_FILE="docker-compose.yml"
            else
              echo "✅ Порты 80 и 443 свободны."
              echo "ℹ️ Запускаем автономный стек со встроенным Caddy (docker-compose.prod.yml)"
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            # Restart production Docker stack
            docker compose -f "$COMPOSE_FILE" up -d --build

            echo "⏳ Waiting for containers to become healthy..."
            sleep 10

            echo "🔍 Probing application health endpoint..."
            for i in $(seq 1 12); do
              if curl -sSf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                echo "✅ mcp-rooms is healthy and responding on http://127.0.0.1:3000/api/health!"
                break
              fi
              echo "Waiting for app to start ($i/12)..."
              sleep 5
            done

            echo "=== FINAL RUNTIME STATUS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- Health API Response ---"
            curl -sS http://127.0.0.1:3000/api/health || true
            echo ""

            echo "🚀 Executing Live E2E MCP & Room Scenarios inside container..."
            docker exec mcp_rooms_marketplace node --import tsx scripts/run-live-scenarios.ts

            echo "✅ Deployment completed successfully!"
