services:
  caddy:
    image: caddy:2-alpine
    container_name: mcp_rooms_caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      - DOMAIN=${DOMAIN:-mcp-rooms.example.com}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp-rooms:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-rooms:
    container_name: mcp_rooms_app
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-rooms:production
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-google}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - DATABASE_PATH=/app/data/mcp_rooms.db
      - DEMO_SEED=${DEMO_SEED:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
