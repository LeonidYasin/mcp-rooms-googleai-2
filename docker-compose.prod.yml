version: '3.8'

services:
  mcp-rooms-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-rooms:prod
    container_name: mcp-rooms-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/mcp_rooms.db
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-disabled}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - mcp-rooms-data:/app/data
    networks:
      - mcp-rooms-net

  caddy:
    image: caddy:2.9-alpine
    container_name: mcp-rooms-caddy
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
      - "${HOST_HTTPS_PORT:-8443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp-rooms-app
    networks:
      - mcp-rooms-net

volumes:
  mcp-rooms-data:
  caddy-data:
  caddy-config:

networks:
  mcp-rooms-net:
    driver: bridge
