services:
  mcp-rooms:
    container_name: mcp_rooms_marketplace
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-rooms:local
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-google}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - DATABASE_PATH=/app/data/mcp_rooms.db
      - DEMO_SEED=${DEMO_SEED:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - RATE_LIMIT_CHAT_PER_MINUTE=${RATE_LIMIT_CHAT_PER_MINUTE:-30}
      - RATE_LIMIT_NEGOTIATE_PER_MINUTE=${RATE_LIMIT_NEGOTIATE_PER_MINUTE:-30}
      - RATE_LIMIT_LISTINGS_PER_MINUTE=${RATE_LIMIT_LISTINGS_PER_MINUTE:-30}
      - RATE_LIMIT_MESSAGES_PER_MINUTE=${RATE_LIMIT_MESSAGES_PER_MINUTE:-120}
      - RATE_LIMIT_MATCH_PER_MINUTE=${RATE_LIMIT_MATCH_PER_MINUTE:-60}
      - RATE_LIMIT_MCP_PER_MINUTE=${RATE_LIMIT_MCP_PER_MINUTE:-240}
    volumes:
      # Persistent SQLite storage on host disk.
      # The container runs as UID/GID 1000 (`node`), so this directory must be
      # owned by 1000:1000 on the host: `sudo chown -R 1000:1000 ./data`.
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/listings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
