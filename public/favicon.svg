<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="12" fill="#0f172a" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#mcpGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Room Ring (Human / Seeker) -->
  <circle cx="19" cy="24" r="8" stroke="url(#mcpGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Right Room Ring (Agent / Offerer) -->
  <circle cx="29" cy="24" r="8" stroke="url(#mcpGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Central Bridge / Handshake Node -->
  <path d="M24 16 L24 32" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- AI Intelligence Core Spark -->
  <circle cx="24" cy="24" r="3.2" fill="url(#sparkGrad)" filter="url(#glow)" />
  <circle cx="24" cy="24" r="1.5" fill="#ffffff" />
</svg>
